<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1 Skills Test</title>
</head>
<body>

    
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTwGsy69hyBl2pbKLeJirKToMBTn4GP0TUSKBkKPG5aRA&s=10" width="300" alt="OBMC Robotics Center Logo" class="logo">
            <h1>OBMC Robotics Club Application Form</h1>
        <label>Welcome! Please fill out this form to <strong>apply</strong> for our school's <em>Robotics Club</em>.</label><br>
            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname" required><br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required><br>
            <label for="grade">Grade Level:</label>
            <select id="grade" name="grade">
                <option >Grade 7</option>
                <option >Grade 8</option>
                <option >Grade 9</option>
                <option >Grade 10</option>
            </select><br>
            <label>Gender:</label>
            <div class="radio-group">
                <input type="radio" id="male" name="gender" >
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender"">
                <label for="female">Female</label>
            </div>
            <label>What are your skills?</label>
            <div class="checkbox-group">
                <input type="checkbox" id="coding" name="skills" value="Coding">
                <label for="coding" class="inline-label">Coding</label>
                <input type="checkbox" id="design" name="skills" value="Design">
                <label for="design" class="inline-label">Design</label>
                <input type="checkbox" id="electronics" name="skills" value="Electronics">
                <label for="electronics" class="inline-label">Electronics</label>
            </div>
            <label for="reason">Tell us why you want to join:</label><br>            <textarea id="reason" name="reason" rows="3"></textarea>
            <h3>Top Robotics Activities We Offer:</h3>
            <ul>
                <li>Line Following Robots</li>
                <li>Obstacle Avoidance Programming</li>
                <li>Light Following Robot</li>
            </ul>
            <dl style="display:none;">
                <dt>Club Status</dt>
                <dd>Active for the current school year</dd>
            </dl>
            <h3>Helpful Links:</h3>
            <ol>
                <li><a href="Robotics.org" target="_blank">Robotics.org</a></li>
                <li><a href="FIRST Robotics" target="_blank">FIRST Robotics</a></li>
            </ol>
            <button type="submit">Submit Application</button>
        </form>
    </div>

</body>
</html>
